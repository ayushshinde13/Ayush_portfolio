<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgRF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1713" />
      <stop offset="100%" stop-color="#12241e" />
    </linearGradient>
    <linearGradient id="emeraldTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <filter id="glowRF" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bgRF)" />

  <!-- House Architectural Vector Icon -->
  <polygon points="400,90 560,220 520,220 520,340 280,340 280,220 240,220" fill="none" stroke="url(#emeraldTeal)" stroke-width="3" filter="url(#glowRF)" />
  <rect x="360" y="240" width="80" height="100" rx="6" fill="#1b332b" stroke="#10B981" stroke-width="1.5" />
  <circle cx="425" cy="290" r="4" fill="#34D399" />

  <!-- Multi-user Badge & Booking Chips -->
  <g transform="translate(110, 140)">
    <rect width="180" height="64" rx="14" fill="rgba(11,23,19,0.9)" stroke="rgba(16,185,129,0.3)" />
    <text x="16" y="26" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="11" font-weight="600">ROLE ARCHITECTURE</text>
    <text x="16" y="50" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Multi-Role Access</text>
  </g>

  <g transform="translate(510, 140)">
    <rect width="180" height="64" rx="14" fill="rgba(11,23,19,0.9)" stroke="rgba(16,185,129,0.3)" />
    <text x="16" y="26" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="11" font-weight="600">BOOKING ENGINE</text>
    <text x="16" y="50" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="700">End-to-End MERN</text>
  </g>

  <g transform="translate(40, 420)">
    <rect width="260" height="36" rx="18" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.15)" />
    <circle cx="20" cy="18" r="4" fill="#10B981" />
    <text x="35" y="23" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Room Finder Platform</text>
  </g>
</svg>
