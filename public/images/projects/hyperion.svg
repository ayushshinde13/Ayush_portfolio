<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091a13" />
      <stop offset="100%" stop-color="#050e0a" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bg4)" />

  <!-- Global Edge Nodes Matrix -->
  <circle cx="400" cy="240" r="160" fill="none" stroke="rgba(16,185,129,0.15)" stroke-width="1.5" />
  <circle cx="400" cy="240" r="100" fill="none" stroke="rgba(16,185,129,0.25)" stroke-width="1.5" stroke-dasharray="6,6" />

  <!-- High-Speed Pulse Wave -->
  <path d="M 120 240 Q 260 160 400 240 T 680 240" fill="none" stroke="url(#emeraldGrad)" stroke-width="3" filter="url(#glow4)" />
  <path d="M 120 240 Q 260 320 400 240 T 680 240" fill="none" stroke="#34D399" stroke-width="2" opacity="0.6" />

  <!-- Central Metric Card -->
  <g transform="translate(310, 190)">
    <rect width="180" height="100" rx="14" fill="#0c231a" stroke="#10B981" stroke-width="2" filter="url(#glow4)" />
    <text x="90" y="44" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">EDGE TTFB</text>
    <text x="90" y="80" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="32" font-weight="800" text-anchor="middle">14ms</text>
  </g>

  <g transform="translate(40, 420)">
    <rect width="180" height="36" rx="18" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.15)" />
    <circle cx="20" cy="18" r="4" fill="#10B981" />
    <text x="35" y="23" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Hyperion Commerce</text>
  </g>
</svg>
