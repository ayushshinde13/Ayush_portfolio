<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180c1e" />
      <stop offset="100%" stop-color="#0a0512" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="glow3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bg3)" />

  <!-- 3D Perspective Grid -->
  <g stroke="rgba(236,72,153,0.15)" stroke-width="1">
    <line x1="100" y1="450" x2="400" y2="280" />
    <line x1="250" y1="450" x2="400" y2="280" />
    <line x1="400" y1="450" x2="400" y2="280" />
    <line x1="550" y1="450" x2="400" y2="280" />
    <line x1="700" y1="450" x2="400" y2="280" />
    <ellipse cx="400" cy="380" rx="260" ry="60" fill="none" />
    <ellipse cx="400" cy="330" rx="180" ry="40" fill="none" />
  </g>

  <!-- Exploded 3D Diaphragm Rings -->
  <ellipse cx="400" cy="200" rx="140" ry="45" fill="none" stroke="url(#pinkGrad)" stroke-width="3" filter="url(#glow3)" />
  <ellipse cx="400" cy="230" rx="120" ry="38" fill="none" stroke="#A855F7" stroke-width="2" />
  <ellipse cx="400" cy="260" rx="100" ry="32" fill="none" stroke="#06B6D4" stroke-width="2" />
  <ellipse cx="400" cy="290" rx="80" ry="25" fill="none" stroke="#EC4899" stroke-width="1.5" />

  <!-- Center Core -->
  <circle cx="400" cy="200" r="36" fill="url(#pinkGrad)" filter="url(#glow3)" opacity="0.8" />

  <!-- Audio Waveform lines -->
  <g stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round">
    <line x1="340" y1="130" x2="340" y2="150" />
    <line x1="360" y1="110" x2="360" y2="170" />
    <line x1="380" y1="95" x2="380" y2="185" />
    <line x1="400" y1="80" x2="400" y2="200" />
    <line x1="420" y1="95" x2="420" y2="185" />
    <line x1="440" y1="110" x2="440" y2="170" />
    <line x1="460" y1="130" x2="460" y2="150" />
  </g>

  <g transform="translate(40, 420)">
    <rect width="180" height="36" rx="18" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.15)" />
    <circle cx="20" cy="18" r="4" fill="#EC4899" />
    <text x="35" y="23" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Vortex 3D Spatial</text>
  </g>
</svg>
