<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0e1c" />
      <stop offset="100%" stop-color="#191530" />
    </linearGradient>
    <linearGradient id="indigoPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="glowSF" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bgSF)" />

  <!-- Ambient Light Orbs -->
  <circle cx="400" cy="200" r="180" fill="#6366F1" opacity="0.15" filter="url(#glowSF)" />

  <!-- Browser Window Mockup -->
  <g transform="translate(140, 90)">
    <rect width="520" height="280" rx="14" fill="#0d1117" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
    
    <!-- Window controls -->
    <circle cx="24" cy="20" r="5" fill="#EF4444" />
    <circle cx="42" cy="20" r="5" fill="#F59E0B" />
    <circle cx="60" cy="20" r="5" fill="#10B981" />
    <line x1="0" y1="38" x2="520" y2="38" stroke="rgba(255,255,255,0.08)" />

    <!-- Hero Content Mockup -->
    <rect x="180" y="70" width="160" height="14" rx="7" fill="url(#indigoPurple)" filter="url(#glowSF)" />
    <rect x="120" y="96" width="280" height="8" rx="4" fill="#94A3B8" opacity="0.5" />
    <rect x="160" y="112" width="200" height="8" rx="4" fill="#64748B" opacity="0.4" />

    <!-- CTA Button -->
    <rect x="210" y="140" width="100" height="28" rx="8" fill="#6366F1" />
    <rect x="235" y="150" width="50" height="8" rx="4" fill="#FFFFFF" opacity="0.9" />

    <!-- Cards Row -->
    <g transform="translate(40, 190)">
      <rect x="0" y="0" width="120" height="60" rx="8" fill="#161b22" stroke="rgba(255,255,255,0.06)" />
      <rect x="150" y="0" width="140" height="60" rx="8" fill="#1f1838" stroke="url(#indigoPurple)" stroke-width="1.5" />
      <rect x="320" y="0" width="120" height="60" rx="8" fill="#161b22" stroke="rgba(255,255,255,0.06)" />
    </g>
  </g>

  <g transform="translate(40, 420)">
    <rect width="260" height="36" rx="18" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.15)" />
    <circle cx="20" cy="18" r="4" fill="#EC4899" />
    <text x="35" y="23" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="600">SaaSFlow Modern Landing</text>
  </g>
</svg>
