<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#110d22" />
      <stop offset="100%" stop-color="#0a0714" />
    </linearGradient>
    <linearGradient id="prismGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bg5)" />

  <!-- Prism Triangular Geometric Shape -->
  <polygon points="400,100 520,330 280,330" fill="none" stroke="url(#prismGrad)" stroke-width="3" filter="url(#glow5)" />
  <polygon points="400,150 480,310 320,310" fill="rgba(139,92,246,0.1)" stroke="rgba(236,72,153,0.4)" stroke-width="1.5" />

  <!-- Refracted Light Beams -->
  <line x1="120" y1="215" x2="350" y2="215" stroke="#FFFFFF" stroke-width="3" opacity="0.9" />
  
  <path d="M 450 215 L 680 150" stroke="#EF4444" stroke-width="2.5" opacity="0.8" />
  <path d="M 450 215 L 680 185" stroke="#F59E0B" stroke-width="2.5" opacity="0.8" />
  <path d="M 450 215 L 680 220" stroke="#10B981" stroke-width="2.5" opacity="0.8" />
  <path d="M 450 215 L 680 255" stroke="#06B6D4" stroke-width="2.5" opacity="0.8" />
  <path d="M 450 215 L 680 290" stroke="#8B5CF6" stroke-width="2.5" opacity="0.8" />

  <!-- UI Token Chips -->
  <g transform="translate(180, 360)">
    <rect width="90" height="32" rx="16" fill="#1f1838" stroke="#8B5CF6" stroke-width="1" />
    <circle cx="16" cy="16" r="5" fill="#8B5CF6" />
    <text x="32" y="20" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Tokens</text>
  </g>
  <g transform="translate(290, 360)">
    <rect width="100" height="32" rx="16" fill="#1f1838" stroke="#EC4899" stroke-width="1" />
    <circle cx="16" cy="16" r="5" fill="#EC4899" />
    <text x="32" y="20" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">WCAG AAA</text>
  </g>
  <g transform="translate(410, 360)">
    <rect width="100" height="32" rx="16" fill="#1f1838" stroke="#06B6D4" stroke-width="1" />
    <circle cx="16" cy="16" r="5" fill="#06B6D4" />
    <text x="32" y="20" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">65+ Comps</text>
  </g>

  <g transform="translate(40, 420)">
    <rect width="180" height="36" rx="18" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.15)" />
    <circle cx="20" cy="18" r="4" fill="#8B5CF6" />
    <text x="35" y="23" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Prism Design System</text>
  </g>
</svg>
