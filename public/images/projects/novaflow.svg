<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" rx="16" fill="#0c101b" />
  
  <!-- Topology Mesh Rings -->
  <circle cx="400" cy="250" r="180" fill="none" stroke="rgba(6,182,212,0.12)" stroke-width="1.5" stroke-dasharray="8,8" />
  <circle cx="400" cy="250" r="120" fill="none" stroke="rgba(6,182,212,0.2)" stroke-width="1.5" />
  <circle cx="400" cy="250" r="60" fill="none" stroke="rgba(59,130,246,0.3)" stroke-width="2" />

  <!-- Center Hub -->
  <circle cx="400" cy="250" r="32" fill="#06B6D4" opacity="0.9" />
  <polygon points="392,240 412,250 392,260" fill="#FFFFFF" />

  <!-- Outer Microservice Nodes -->
  <g stroke="#06B6D4" stroke-width="1.5" opacity="0.7">
    <line x1="400" y1="250" x2="240" y2="150" />
    <line x1="400" y1="250" x2="560" y2="150" />
    <line x1="400" y1="250" x2="200" y2="310" />
    <line x1="400" y1="250" x2="600" y2="310" />
    <line x1="400" y1="250" x2="400" y2="410" />
  </g>

  <!-- Node Circles -->
  <circle cx="240" cy="150" r="18" fill="#111927" stroke="#06B6D4" stroke-width="2" />
  <circle cx="560" cy="150" r="18" fill="#111927" stroke="#3B82F6" stroke-width="2" />
  <circle cx="200" cy="310" r="18" fill="#111927" stroke="#06B6D4" stroke-width="2" />
  <circle cx="600" cy="310" r="18" fill="#111927" stroke="#3B82F6" stroke-width="2" />
  <circle cx="400" cy="410" r="18" fill="#111927" stroke="#10B981" stroke-width="2" />

  <!-- Status indicators -->
  <circle cx="240" cy="150" r="5" fill="#06B6D4" />
  <circle cx="560" cy="150" r="5" fill="#3B82F6" />
  <circle cx="200" cy="310" r="5" fill="#06B6D4" />
  <circle cx="600" cy="310" r="5" fill="#3B82F6" />
  <circle cx="400" cy="410" r="5" fill="#10B981" />

  <!-- Flow Data Particles -->
  <circle cx="320" cy="200" r="4" fill="#FFFFFF" />
  <circle cx="480" cy="200" r="4" fill="#FFFFFF" />
  <circle cx="300" cy="280" r="4" fill="#FFFFFF" />
  <circle cx="500" cy="280" r="4" fill="#FFFFFF" />

  <!-- Project Badge -->
  <g transform="translate(40, 420)">
    <rect width="250" height="36" rx="18" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.15)" />
    <circle cx="20" cy="18" r="4" fill="#06B6D4" />
    <text x="35" y="23" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Novaflow Microservices</text>
  </g>
</svg>
