<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Flat Solid Background -->
  <rect width="800" height="500" rx="16" fill="#0c101b" />
  
  <!-- Dashboard Grid -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="700" y1="0" x2="700" y2="500" />
    <line x1="0" y1="250" x2="800" y2="250" />
  </g>

  <!-- Central ATS Score Radial Gauge -->
  <circle cx="280" cy="230" r="90" fill="none" stroke="rgba(139,92,246,0.15)" stroke-width="16" />
  <circle cx="280" cy="230" r="90" fill="none" stroke="#8B5CF6" stroke-width="16" stroke-dasharray="450" stroke-dashoffset="60" stroke-linecap="round" />
  <text x="280" y="225" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="38" font-weight="900" text-anchor="middle">94%</text>
  <text x="280" y="255" fill="#A5B4FC" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">ATS MATCH</text>

  <!-- Analytics Chart Panel -->
  <g transform="translate(430, 130)">
    <rect width="280" height="200" rx="16" fill="#101927" stroke="rgba(255,255,255,0.1)" />
    <rect x="20" y="20" width="100" height="10" rx="5" fill="#8B5CF6" />
    <rect x="20" y="40" width="140" height="6" rx="3" fill="#64748B" />

    <!-- Bar chart visualization -->
    <rect x="25" y="140" width="22" height="30" rx="4" fill="#3B82F6" opacity="0.6" />
    <rect x="55" y="110" width="22" height="60" rx="4" fill="#8B5CF6" opacity="0.7" />
    <rect x="85" y="90" width="22" height="80" rx="4" fill="#06B6D4" opacity="0.8" />
    <rect x="115" y="70" width="22" height="100" rx="4" fill="#10B981" />
    <rect x="145" y="95" width="22" height="75" rx="4" fill="#8B5CF6" opacity="0.7" />
    <rect x="175" y="80" width="22" height="90" rx="4" fill="#06B6D4" opacity="0.8" />
    <rect x="205" y="60" width="22" height="110" rx="4" fill="#8B5CF6" />
    <rect x="235" y="85" width="22" height="85" rx="4" fill="#3B82F6" opacity="0.6" />
  </g>

  <g transform="translate(40, 420)">
    <rect width="270" height="36" rx="18" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.15)" />
    <circle cx="20" cy="18" r="4" fill="#8B5CF6" />
    <text x="35" y="23" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="600">AI Resume Analyzer System</text>
  </g>
</svg>
