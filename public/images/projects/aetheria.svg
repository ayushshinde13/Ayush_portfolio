<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" rx="16" fill="#0c101b" />
  
  <!-- Subtle Canvas Grid -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <!-- Node Connection Lines -->
  <path d="M 180 250 C 260 250, 280 180, 360 180" fill="none" stroke="#6366F1" stroke-width="2.5" />
  <path d="M 360 180 C 440 180, 460 310, 540 310" fill="none" stroke="#06B6D4" stroke-width="2.5" />
  <path d="M 180 250 C 260 250, 280 340, 360 340" fill="none" stroke="#EC4899" stroke-width="2" stroke-dasharray="6,6" />
  <path d="M 360 340 C 440 340, 460 310, 540 310" fill="none" stroke="#EC4899" stroke-width="2" />

  <!-- Node Cards -->
  <!-- Node 1: Input Prompt -->
  <rect x="90" y="210" width="130" height="80" rx="10" fill="#131724" stroke="#6366F1" stroke-width="1.5" />
  <circle cx="115" cy="235" r="5" fill="#6366F1" />
  <rect x="130" y="231" width="60" height="8" rx="4" fill="#E2E8F0" opacity="0.8" />
  <rect x="110" y="255" width="90" height="6" rx="3" fill="#64748B" opacity="0.5" />
  <rect x="110" y="268" width="70" height="6" rx="3" fill="#64748B" opacity="0.4" />

  <!-- Node 2: Diffusion Engine -->
  <rect x="310" y="130" width="150" height="100" rx="12" fill="#131724" stroke="#6366F1" stroke-width="2" />
  <rect x="325" y="150" width="80" height="10" rx="4" fill="#A855F7" />
  <rect x="325" y="172" width="120" height="6" rx="3" fill="#94A3B8" opacity="0.6" />
  <rect x="325" y="186" width="100" height="6" rx="3" fill="#94A3B8" opacity="0.4" />
  <circle cx="435" cy="180" r="14" fill="#6366F1" opacity="0.2" />
  <polygon points="433,174 441,180 433,186" fill="#818CF8" />

  <!-- Node 3: Audio Sync -->
  <rect x="310" y="300" width="140" height="80" rx="10" fill="#131724" stroke="#EC4899" stroke-width="1.5" />
  <rect x="325" y="320" width="70" height="8" rx="4" fill="#EC4899" />
  <rect x="325" y="340" width="100" height="6" rx="3" fill="#64748B" opacity="0.5" />

  <!-- Node 4: 4K Neural Render Output -->
  <rect x="520" y="240" width="170" height="130" rx="14" fill="#182033" stroke="#06B6D4" stroke-width="2" />
  <rect x="535" y="260" width="100" height="10" rx="4" fill="#06B6D4" />
  <circle cx="605" cy="320" r="28" fill="#6366F1" opacity="0.3" />
  <rect x="575" y="315" width="60" height="12" rx="6" fill="#FFFFFF" opacity="0.9" />

  <!-- Overlay Badge -->
  <g transform="translate(40, 420)">
    <rect width="180" height="36" rx="18" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.15)" />
    <circle cx="20" cy="18" r="4" fill="#10B981" />
    <text x="35" y="23" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Aetheria AI Canvas</text>
  </g>
</svg>
