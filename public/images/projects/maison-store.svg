<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141118" />
      <stop offset="100%" stop-color="#1d1726" />
    </linearGradient>
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#FB7185" />
    </linearGradient>
    <filter id="glowMS" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bgMS)" />

  <!-- E-commerce Grid Layout -->
  <g transform="translate(100, 70)">
    <!-- Search and Filter Bar -->
    <rect x="0" y="0" width="600" height="42" rx="12" fill="#1f1a29" stroke="rgba(255,255,255,0.08)" />
    <circle cx="24" cy="21" r="6" fill="none" stroke="#94A3B8" stroke-width="1.5" />
    <line x1="28" y1="25" x2="34" y2="31" stroke="#94A3B8" stroke-width="1.5" />
    <rect x="50" y="16" width="120" height="10" rx="5" fill="#64748B" opacity="0.5" />

    <!-- Product Card 1 -->
    <g transform="translate(0, 64)">
      <rect width="180" height="230" rx="12" fill="#1a1523" stroke="rgba(255,255,255,0.08)" />
      <rect x="12" y="12" width="156" height="130" rx="8" fill="#251e33" />
      <circle cx="90" cy="77" r="30" fill="url(#roseGold)" opacity="0.3" filter="url(#glowMS)" />
      <rect x="16" y="156" width="110" height="10" rx="5" fill="#E2E8F0" />
      <rect x="16" y="174" width="70" height="8" rx="4" fill="#94A3B8" opacity="0.6" />
      <rect x="16" y="196" width="50" height="14" rx="6" fill="#F43F5E" />
    </g>

    <!-- Product Card 2 (Active/Hovered) -->
    <g transform="translate(210, 64)">
      <rect width="180" height="230" rx="12" fill="#241b32" stroke="url(#roseGold)" stroke-width="1.5" filter="url(#glowMS)" />
      <rect x="12" y="12" width="156" height="130" rx="8" fill="#2c2040" />
      <polygon points="90,45 120,105 60,105" fill="url(#roseGold)" />
      <rect x="16" y="156" width="120" height="10" rx="5" fill="#FFFFFF" />
      <rect x="16" y="174" width="80" height="8" rx="4" fill="#FDA4AF" />
      <rect x="16" y="196" width="60" height="14" rx="6" fill="#FB7185" />
    </g>

    <!-- Product Card 3 -->
    <g transform="translate(420, 64)">
      <rect width="180" height="230" rx="12" fill="#1a1523" stroke="rgba(255,255,255,0.08)" />
      <rect x="12" y="12" width="156" height="130" rx="8" fill="#251e33" />
      <rect x="60" y="50" width="60" height="54" rx="10" fill="#4C1D95" opacity="0.5" />
      <rect x="16" y="156" width="100" height="10" rx="5" fill="#E2E8F0" />
      <rect x="16" y="174" width="60" height="8" rx="4" fill="#94A3B8" opacity="0.6" />
      <rect x="16" y="196" width="50" height="14" rx="6" fill="#F43F5E" />
    </g>
  </g>

  <g transform="translate(40, 420)">
    <rect width="250" height="36" rx="18" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.15)" />
    <circle cx="20" cy="18" r="4" fill="#F43F5E" />
    <text x="35" y="23" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Maison Premium Store</text>
  </g>
</svg>
