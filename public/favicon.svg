<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Circular Ring Gradient: Indigo -> Electric Blue -> Cyan -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="45%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>

    <!-- AKS Monogram Text Gradient: Ice Blue -> Vivid Cyan -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe" />
      <stop offset="40%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#67e8f9" />
    </linearGradient>

    <!-- Subtle Outer Ring Glow -->
    <filter id="ringGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Obsidian Circular Background -->
  <circle cx="50" cy="50" r="48" fill="#08090d" />

  <!-- Neon Glowing Outer Border Ring -->
  <circle cx="50" cy="50" r="45.5" fill="none" stroke="url(#ringGrad)" stroke-width="4.5" filter="url(#ringGlow)" />

  <!-- Bold AKS Monogram Text -->
  <text
    x="50"
    y="51.5"
    text-anchor="middle"
    dominant-baseline="central"
    fill="url(#textGrad)"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-size="36"
    font-weight="900"
    letter-spacing="-1.2"
  >
    AKS
  </text>
</svg>
